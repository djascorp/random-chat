# Minimal coturn configuration for local and single-host deployments.
#
# Replace static-auth-secret with a long random value and give the same value to
# the API through TURN_CREDENTIAL (TURN_USERNAME can be left as the realm user).
#
# Set external-ip on any host behind NAT or a cloud load balancer, otherwise the
# relay address advertised to browsers is unreachable:
#   external-ip=203.0.113.10

listening-port=3478
fingerprint
realm=randomchat.local

# Long-term credentials. Swap for use-auth-secret + rotating credentials when
# the API grows a /api/turn-credentials endpoint.
lt-cred-mech
user=randomchat:TURN_SHARED_SECRET

min-port=49152
max-port=65535

# Keep the relay surface small: no CLI, no unauthenticated use.
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1

# Uncomment to enable TLS passthrough for turns:// (recommended in production).
# cert=/etc/coturn/fullchain.pem
# pkey=/etc/coturn/privkey.pem

log-file=stdout
simple-log
